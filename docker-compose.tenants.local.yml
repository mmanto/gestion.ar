# docker-compose.tenants.local.yml — Simulación local de multi-tenant por dominio
# (Fase 7). NO usar en producción: el traefik acá no tiene TLS/ACME, solo
# rutea por Host en :80.
#
# DOS contenedores fijos (frontend-tenant + landing), igual que en prod. Dos
# convenciones de host local:
#   - Tenants sin dominio real (erma, ius): dominio simulado *.test resuelto a
#     127.0.0.1 vía /etc/hosts. No coincide con tenants.domain de la BD, así que
#     el tenant se fuerza con ?tenant=<id> (persistido en localStorage por
#     TenantContext).
#   - Tenants con dominio propio (pachoteayuda): `<dominio>.localhost`
#     (pachoteayuda.ar.localhost). Cualquier *.localhost resuelve a loopback por
#     RFC 6761 — no hace falta /etc/hosts — y el backend resuelve el tenant por
#     Host quitando el sufijo .localhost (GET /api/public/tenants/current).
#
# Setup:
#   1. Agregar a /etc/hosts (solo los dominios .test):
#        127.0.0.1 erma.com.test
#        127.0.0.1 ius.mx.test
#   2. docker compose -f docker-compose.yml -f docker-compose.tenants.local.yml up -d --build
#   3. Abrir http://erma.com.test?tenant=<tenant_id> o
#      http://ius.mx.test?tenant=<tenant_id> (la landing de ius vive en la raíz
#      de ius.mx.test, ver comentario en landing-ius más abajo), o
#      http://pachoteayuda.ar.localhost/ (landing en la raíz + /normas/,
#      /tramites/ y /residuos/; el SPA del tenant en el resto de las rutas)
#
# Para bajar solo esto: docker compose -f docker-compose.yml -f docker-compose.tenants.local.yml down
#
# Hot reload (ajustes visuales sin reconstruir la imagen): agregar
# -f docker-compose.tenants.dev.yml al final de cualquiera de los comandos
# de arriba — ver ese archivo para el detalle.

services:
  # Passkeys (WebAuthn): el RP ID sale del dominio de la página, así que no hay
  # nada que configurar por tenant. Lo único a tener en cuenta: el navegador
  # solo expone WebAuthn en contexto seguro, y de los hosts locales solo los
  # *.localhost lo son — en http://erma.com.test / http://ius.mx.test el botón
  # de passkey no aparece. Se prueba en pachoteayuda.ar.localhost, el tenant con
  # dominio propio simulado.
  # La ceremonia usa el dominio de la página (pachoteayuda.ar.localhost); el
  # backend lo acepta porque resuelve el tenant quitando el sufijo .localhost
  # (ver TenantService.get_tenant_by_host).
  traefik-local:
    image: traefik:v3.6
    container_name: gestionar_traefik_local
    restart: unless-stopped
    ports:
      - "80:80"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_public
      - --entrypoints.web.address=:80
      - --log.level=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_public

  frontend-tenant:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: http://localhost:8180/remoteEntry.js
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-erma.rule=Host(`erma.com.test`)"
      - "traefik.http.routers.tenant-erma.entrypoints=web"
      - "traefik.http.routers.tenant-erma.priority=1"
      - "traefik.http.routers.tenant-erma.service=tenant-erma"
      - "traefik.http.services.tenant-erma.loadbalancer.server.port=80"
      - "traefik.http.routers.tenant-ius.rule=Host(`ius.mx.test`)"
      - "traefik.http.routers.tenant-ius.entrypoints=web"
      - "traefik.http.routers.tenant-ius.priority=1"
      - "traefik.http.routers.tenant-ius.service=tenant-ius"
      - "traefik.http.services.tenant-ius.loadbalancer.server.port=80"
      # Tenant con dominio propio: se prueba en <dominio>.localhost (ver
      # cabecera) — `pachoteayuda.ar` a secas resolvería al sitio de prod.
      - "traefik.http.routers.tenant-pachoteayuda.rule=Host(`pachoteayuda.ar.localhost`)"
      - "traefik.http.routers.tenant-pachoteayuda.entrypoints=web"
      - "traefik.http.routers.tenant-pachoteayuda.priority=1"
      - "traefik.http.routers.tenant-pachoteayuda.service=tenant-pachoteayuda"
      - "traefik.http.services.tenant-pachoteayuda.loadbalancer.server.port=80"

  # landing comparte dominio con frontend-tenant: este router matchea "/",
  # cualquier página .html y los assets de la landing; todo lo demás cae en
  # frontend-tenant (priority 1 < 10). El sitio se elige por Host en
  # sites/nginx.conf (map $http_host $landing_root, con los hosts .test).
  landing:
    build:
      context: ./sites
    container_name: gestionar_landing
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-erma.rule=Host(`erma.com.test`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/chat-widget.js`) || Path(`/scroll-fix.js`) || Path(`/assets/bundle.js`) || Path(`/assets/style-DsA80jQ7.css`) || Path(`/hero-video.mp4`) || Path(`/img-about.jpg`) || Path(`/img-gallery-1.jpg`) || Path(`/img-gallery-2.jpg`) || Path(`/img-gallery-3.jpg`) || Path(`/img-gallery-4.jpg`) || Path(`/img-gallery-5.jpg`) || Path(`/img-hero.jpg`) || Path(`/img-news-1.jpg`) || Path(`/img-news-2.jpg`) || Path(`/img-team-1.jpg`) || Path(`/img-team-2.jpg`) || Path(`/img-team-3.jpg`) || Path(`/img-team-barbara.jpg`) || Path(`/img-team-camila.jpg`) || Path(`/img-team-delfina.jpg`) || Path(`/img-team-micaela.jpg`) || Path(`/img-team-valeria.jpg`))'
      - "traefik.http.routers.landing-erma.entrypoints=web"
      - "traefik.http.routers.landing-erma.priority=10"
      - "traefik.http.routers.landing-erma.service=landing-erma"
      - "traefik.http.services.landing-erma.loadbalancer.server.port=80"
      - 'traefik.http.routers.landing-ius.rule=Host(`ius.mx.test`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/register-embed.js`) || Path(`/footer.css`) || Path(`/favicon.svg`) || Path(`/favicon-32.png`) || Path(`/apple-touch-icon.png`) || Path(`/logo-horizontal.svg`) || Path(`/logo-horizontal-blanco.svg`) || Path(`/logo-vertical-blanco.svg`) || Path(`/despacho-hero.jpg`) || Path(`/estudio.jpg`) || Path(`/testimonios-bg.jpg`) || Path(`/eduardo-sandoval.webp`) || Path(`/og-image.png`))'
      - "traefik.http.routers.landing-ius.entrypoints=web"
      - "traefik.http.routers.landing-ius.priority=10"
      - "traefik.http.routers.landing-ius.service=landing-ius"
      - "traefik.http.services.landing-ius.loadbalancer.server.port=80"
      # pachoteayuda: mismo reparto de paths que en prod
      # (docker-compose.tenants.prod.yml) — la landing se queda con /, los
      # .html, sus assets bajo /landing/, las páginas generadas (/normas/,
      # /tramites/, /residuos/) y /reclamos/; todo lo demás (/login,
      # /chat/c/..., /api/*, /ws/*) cae en el SPA del tenant (priority 1 < 10).
      - 'traefik.http.routers.landing-pachoteayuda.rule=Host(`pachoteayuda.ar.localhost`) && (Path(`/`) || PathRegexp(`^/.*\.html$`) || Path(`/chat-widget.js`) || Path(`/robots.txt`) || Path(`/sitemap.xml`) || Path(`/reclamos`) || PathPrefix(`/reclamos/`) || PathPrefix(`/landing/`) || PathPrefix(`/normas/`) || PathPrefix(`/tramites/`) || PathPrefix(`/residuos/`))'
      - "traefik.http.routers.landing-pachoteayuda.entrypoints=web"
      - "traefik.http.routers.landing-pachoteayuda.priority=10"
      - "traefik.http.routers.landing-pachoteayuda.service=landing-pachoteayuda"
      - "traefik.http.services.landing-pachoteayuda.loadbalancer.server.port=80"
