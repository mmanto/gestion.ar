# docker-compose.tenants.local.yml — Simulación local de multi-tenant por dominio
# (Fase 7). NO usar en producción: el traefik acá no tiene TLS/ACME, solo
# rutea por Host en :80 para probar con dominios *.test resueltos a 127.0.0.1
# vía /etc/hosts.
#
# DOS contenedores fijos (frontend-tenant + landing), igual que en prod. En dev
# local el tenant NO se resuelve por Host (los dominios *.test no coinciden con
# tenants.domain de la BD), así que se fuerza con ?tenant=<id> (persistido en
# localStorage por TenantContext).
#
# Setup:
#   1. Agregar a /etc/hosts:
#        127.0.0.1 erma.com.test
#        127.0.0.1 ius.mx.test
#   2. docker compose -f docker-compose.yml -f docker-compose.tenants.local.yml up -d --build
#   3. Abrir http://erma.com.test?tenant=<tenant_id> o
#      http://ius.mx.test?tenant=<tenant_id> (la landing de ius vive en la raíz
#      de ius.mx.test, ver comentario en landing-ius más abajo)
#
# Para bajar solo esto: docker compose -f docker-compose.yml -f docker-compose.tenants.local.yml down
#
# Hot reload (ajustes visuales sin reconstruir la imagen): agregar
# -f docker-compose.tenants.dev.yml al final de cualquiera de los comandos
# de arriba — ver ese archivo para el detalle.

services:
  traefik-local:
    image: traefik:v3.6
    container_name: gestionar_traefik_local
    restart: unless-stopped
    ports:
      - "80:80"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_public
      - --entrypoints.web.address=:80
      - --log.level=INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_public

  frontend-tenant:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: http://localhost:8180/remoteEntry.js
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-erma.rule=Host(`erma.com.test`)"
      - "traefik.http.routers.tenant-erma.entrypoints=web"
      - "traefik.http.routers.tenant-erma.priority=1"
      - "traefik.http.services.tenant-erma.loadbalancer.server.port=80"
      - "traefik.http.routers.tenant-ius.rule=Host(`ius.mx.test`)"
      - "traefik.http.routers.tenant-ius.entrypoints=web"
      - "traefik.http.routers.tenant-ius.priority=1"
      - "traefik.http.services.tenant-ius.loadbalancer.server.port=80"
      - "traefik.http.routers.tenant-pachoteayuda.rule=Host(`pachoteayuda.ar`)"
      - "traefik.http.routers.tenant-pachoteayuda.entrypoints=web"
      - "traefik.http.routers.tenant-pachoteayuda.priority=1"
      - "traefik.http.services.tenant-pachoteayuda.loadbalancer.server.port=80"

  # landing comparte dominio con frontend-tenant: este router matchea "/",
  # cualquier página .html y los assets de la landing; todo lo demás cae en
  # frontend-tenant (priority 1 < 10). El sitio se elige por Host en
  # sites/nginx.conf (map $http_host $landing_root, con los hosts .test).
  landing:
    build:
      context: ./sites
    container_name: gestionar_landing
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-erma.rule=Host(`erma.com.test`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/chat-widget.js`) || Path(`/scroll-fix.js`) || Path(`/assets/bundle.js`) || Path(`/assets/style-DsA80jQ7.css`) || Path(`/hero-video.mp4`) || Path(`/img-about.jpg`) || Path(`/img-gallery-1.jpg`) || Path(`/img-gallery-2.jpg`) || Path(`/img-gallery-3.jpg`) || Path(`/img-gallery-4.jpg`) || Path(`/img-gallery-5.jpg`) || Path(`/img-hero.jpg`) || Path(`/img-news-1.jpg`) || Path(`/img-news-2.jpg`) || Path(`/img-team-1.jpg`) || Path(`/img-team-2.jpg`) || Path(`/img-team-3.jpg`) || Path(`/img-team-barbara.jpg`) || Path(`/img-team-camila.jpg`) || Path(`/img-team-delfina.jpg`) || Path(`/img-team-micaela.jpg`) || Path(`/img-team-valeria.jpg`))'
      - "traefik.http.routers.landing-erma.entrypoints=web"
      - "traefik.http.routers.landing-erma.priority=10"
      - "traefik.http.services.landing-erma.loadbalancer.server.port=80"
      - 'traefik.http.routers.landing-ius.rule=Host(`ius.mx.test`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/register-embed.js`) || Path(`/footer.css`) || Path(`/favicon.svg`) || Path(`/favicon-32.png`) || Path(`/apple-touch-icon.png`) || Path(`/logo-horizontal.svg`) || Path(`/logo-horizontal-blanco.svg`) || Path(`/logo-vertical-blanco.svg`) || Path(`/despacho-hero.jpg`) || Path(`/estudio.jpg`) || Path(`/testimonios-bg.jpg`) || Path(`/eduardo-sandoval.webp`) || Path(`/og-image.png`))'
      - "traefik.http.routers.landing-ius.entrypoints=web"
      - "traefik.http.routers.landing-ius.priority=10"
      - "traefik.http.services.landing-ius.loadbalancer.server.port=80"
