
services:
  # PostgreSQL (base de datos principal — ver ADR-006)
  postgres:
    image: postgres:16
    container_name: gestionar_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-gestionar}
      POSTGRES_USER: ${DB_USER:-gestionar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestionar_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gestionar_user} -d ${DB_NAME:-gestionar}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (cache e idempotencia)
  redis:
    image: redis:7-alpine
    container_name: gestionar_redis
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Aplicación FastAPI (backend)
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: gestionar_app
    env_file:
      - ./.env.dev
    environment:
      - REDIS_URL=redis://redis:6379
      - CHROMA_PATH=/app/chroma_db
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-gestionar_user}:${DB_PASSWORD:-gestionar_dev_password}@postgres:5432/${DB_NAME:-gestionar}
    volumes:
      - chroma_data:/app/chroma_db
      - ./docs:/app/documents
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - default

  # Frontend React (Nginx — proxy /api/ y /ws/ al backend internamente)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestionar_frontend
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gestionar.rule=Host(`dev.gestionar.kairosgroup.ar`)"
      - "traefik.http.routers.gestionar.entrypoints=websecure"
      - "traefik.http.routers.gestionar.tls.certresolver=letsencrypt"
      - "traefik.http.services.gestionar.loadbalancer.server.port=80"

  # Traefik — solo activo con: docker compose --profile traefik up -d
  # ADVERTENCIA: en el servidor de producción de intellify.pro NO usar este
  # perfil. Ese servidor ya corre un Traefik standalone compartido
  # (infra/traefik/, container "traefik") bindeado a 80/443 para varios
  # proyectos del mismo host — levantar este servicio ahí compite por esos
  # puertos y rompe el routing de todos. Ver docs/ops/DEPLOYMENT.md.
  traefik:
    image: traefik:v3.6
    container_name: gestionar_traefik
    restart: unless-stopped
    profiles: ["traefik"]
    ports:
      - "80:80"
      - "443:443"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik_public
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.email=admin@kairosgroup.ar
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json
    networks:
      - traefik_public

volumes:
  chroma_data:
  postgres_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN

networks:
  default:
    name: gestionar_network
  # external: true — esta red la puede compartir más de un proyecto en el
  # mismo servidor (Traefik standalone de infra/traefik/ + otros compose
  # projects). Si no se marca external acá, un simple "docker compose down"
  # con SOLO este archivo (sin -f docker-compose.prod.yml) se cree dueño de
  # la red y la recrea, huerfanando cualquier contenedor externo que ya
  # estuviera conectado (así se cayó el Traefik de producción una vez).
  # Para uso local: crear la red una vez a mano con
  #   docker network create traefik_public
  traefik_public:
    name: traefik_public
    external: true
