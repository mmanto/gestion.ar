# docker-compose.prod.yml — Overrides de producción
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile traefik up -d --build
#
# Requiere en el servidor:
#   - .env              → REGISTRY_IMAGE, DB_USER, DB_PASSWORD, DB_NAME (ver .env.example)
#   - backend/.env.prod → credenciales reales
#   - docs/             → directorio (puede estar vacío)
#
# El Traefik en uso HOY es el servicio "traefik" embebido en docker-compose.yml
# (perfil "traefik", container gestionar_traefik, challenge TLS-ALPN-01 vía
# --certificatesresolvers.letsencrypt.acme.tlschallenge=true) — por eso hace
# falta pasar --profile traefik en el comando de arriba, si no Compose lo deja
# fuera del scope por defecto (igual sigue corriendo si ya estaba arriba, pero
# es más prolijo incluirlo explícitamente).
#
# infra/traefik/ (standalone, HTTP-01) es una alternativa documentada pero NO
# es la que corre en este servidor — no migrar a esa sin coordinarlo antes,
# ya que implicaría liberar los puertos 80/443 del Traefik embebido primero.

services:
  app:
    image: ${REGISTRY_IMAGE}/backend:${IMAGE_TAG:-latest}
    env_file:
      - ./backend/.env.prod
    environment:
      - REDIS_URL=redis://redis:6379
      - CHROMA_PATH=/app/chroma_db
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-gestionar}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.intellify-api.rule=Host(`api.intellify.pro`)"
      - "traefik.http.routers.intellify-api.entrypoints=websecure"
      - "traefik.http.routers.intellify-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.intellify-api.loadbalancer.server.port=8000"

  frontend:
    image: ${REGISTRY_IMAGE}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.intellify-admin.rule=Host(`admin.intellify.pro`)"
      - "traefik.http.routers.intellify-admin.entrypoints=websecure"
      - "traefik.http.routers.intellify-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.intellify-admin.loadbalancer.server.port=80"

# En prod se usa el Traefik externo del infra — la red debe ser la global
networks:
  traefik_public:
    external: true
    name: traefik_public
