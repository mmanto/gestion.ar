# docker-compose.prod.yml — Overrides de producción
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requiere en el servidor:
#   - .env.prod → REGISTRY_IMAGE, DB_USER, DB_PASSWORD, DB_NAME y credenciales
#     reales (ver .env.example). Pasar --env-file .env.prod al comando de
#     arriba, o usar ./deploy.sh que ya lo hace.
#   - docs/             → directorio (puede estar vacío)
#   - Traefik standalone de infra/traefik/ corriendo (container "traefik",
#     HTTP-01, red traefik_public) — este es el reverse proxy real del
#     servidor, compartido con otros proyectos (cooperschol, insurance-api).
#
# IMPORTANTE: NO pasar --profile traefik en el comando de arriba. Este
# compose file también trae un servicio "traefik" embebido (perfil
# "traefik", container gestionar_traefik) pensado solo para levantar el
# stack de forma aislada en otro servidor — en ESTE servidor ya corre el
# Traefik standalone de infra/traefik/ bindeado a 80/443, y si el embebido
# intenta arrancar compite por esos mismos puertos y rompe el routing de
# TODOS los proyectos del servidor, no solo de este.

services:
  app:
    image: ${REGISTRY_IMAGE}/backend:${IMAGE_TAG:-latest}
    env_file:
      - ./.env.prod
    environment:
      - REDIS_URL=redis://redis:6379
      - CHROMA_PATH=/app/chroma_db
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-gestionar}
    # /opt/secrets vive en el servidor, fuera del clone del repo (nunca en
    # git) — hoy solo firebase-credentials.json (push nativo staff, ver
    # FCM_CREDENTIALS_PATH en .env.prod y docs/dev/MOBILE.md). :ro porque el
    # backend solo lee credenciales, nunca las escribe.
    #
    # /opt/models/embedding-model: snapshot local del modelo de embeddings RAG
    # para hosts cuyo build NO alcanza huggingface.co (el paso de bake del
    # Dockerfile es tolerante y la imagen sale sin modelo). Se activa con
    # EMBEDDING_MODEL=/models/embedding-model en .env.prod. Si la carpeta no
    # existe o la env no está definida, no tiene efecto (se usa el modelo
    # bakeado en la imagen). Ver docs/ops/RUNBOOK.md.
    volumes:
      - /opt/secrets:/app/secrets:ro
      - /opt/models/embedding-model:/models/embedding-model:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.intellify-api.rule=Host(`api.intellify.pro`)"
      - "traefik.http.routers.intellify-api.entrypoints=websecure"
      - "traefik.http.routers.intellify-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.intellify-api.loadbalancer.server.port=8000"

  frontend:
    image: ${REGISTRY_IMAGE}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_APPOINTMENTS_REMOTE_URL=${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        - VITE_NANGO_CONNECT_URL=https://nango.intellify.pro
        - VITE_NANGO_API_URL=https://api.nango.intellify.pro
    # OJO: Compose mergea "labels" por clave, no reemplaza la lista entera.
    # docker-compose.yml (base) ya define un router/service "gestionar" para
    # este mismo servicio (Host dev.gestionar.kairosgroup.ar) — hay que
    # REUSAR ese mismo nombre acá para que el Host() nuevo pise al viejo por
    # clave, en vez de crear un segundo router/service en paralelo (eso hace
    # que Traefik no pueda linkear ninguno de los dos: "cannot be linked
    # automatically with multiple Services").
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gestionar.rule=Host(`admin.intellify.pro`)"
      - "traefik.http.routers.gestionar.entrypoints=websecure"
      - "traefik.http.routers.gestionar.tls.certresolver=letsencrypt"
      - "traefik.http.services.gestionar.loadbalancer.server.port=80"

# El Traefik real es el standalone de infra/traefik/ — la red traefik_public
# ya existe, se referencia como externa acá para no intentar recrearla.
networks:
  traefik_public:
    external: true
    name: traefik_public
