server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # === Config del tenant, generada por docker-entrypoint.sh al arrancar
    # (NUNCA debe cachearse: la misma imagen se reutiliza para cualquier
    # tenant, sólo cambia el env TENANT_ID por contenedor) ===
    location = /tenant-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # === PWA: Service Worker (NUNCA debe cachearse) ===
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # === SPA: el HTML de entrada NUNCA se cachea (revalida en cada carga).
    # index.html referencia los assets con hash, así que si el navegador lo
    # guarda "fresco" por heurística (sin Cache-Control) un deploy queda
    # invisible para quien ya visitó el sitio: seguiría ejecutando el bundle
    # viejo durante horas. Los assets hasheados sí van con cache inmutable
    # (ver bloque de estáticos de abajo) — mismo criterio que sw.js.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # === PWA: Web App Manifest ===
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Cache de archivos estáticos (excluyendo sw.js — ya tiene su bloque propio)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy para el backend (HTTP)
    # ^~ : gana por sobre el location ~* de arriba (cache de estáticos) para
    # cualquier request bajo /api/ — sin esto, algo como /api/uploads/x.png
    # matcheaba el bloque de cache de estáticos (nginx prioriza location con
    # regex sobre location de prefijo simple) y nunca llegaba al proxy_pass,
    # devolviendo 404 (el fallback de error_page a index.html) en vez de
    # pasarlo al backend.
    location ^~ /api/ {
        client_max_body_size 50M;
        proxy_pass http://app:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme sería siempre "http" acá (Traefik termina TLS y reenvía en
        # plano a este nginx) — se preserva el proto que puso Traefik en vez
        # de pisarlo, para que el backend sepa si el cliente real usó https.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Proxy para WebSocket
    location /ws/ {
        proxy_pass http://app:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme sería siempre "http" acá (Traefik termina TLS y reenvía en
        # plano a este nginx) — se preserva el proto que puso Traefik en vez
        # de pisarlo, para que el backend sepa si el cliente real usó https.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA routing - todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Manejo de errores
    error_page 404 /index.html;

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
