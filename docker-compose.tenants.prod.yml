# docker-compose.tenants.prod.yml — Tenants con dominio propio (Fase 7, productivo)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#        -f docker-compose.tenants.prod.yml up -d --build
#
# DOS contenedores fijos para TODOS los tenants (antes un contenedor por
# tenant): `frontend-tenant` sirve el SPA de todos y `landing` sirve todas las
# landings. El tenant y el sitio se resuelven por el Host de la request:
#   - frontend-tenant  -> GET /api/public/tenants/current (matchea tenants.domain)
#   - landing          -> nginx map $http_host $landing_root (sites/nginx.conf)
# No hay TENANT_ID/TENANT_SLUG por contenedor; los flags de runtime por tenant
# (p. ej. stats_two_cols_mobile) viven en tenants.settings (ver ADR en
# docs/dev/DECISIONS.md).
#
# Alta de un tenant nuevo (subdominio *.intellify.pro):
#   1. Crear el tenant (plan, tenant, usuario admin, bot, canal, módulos) desde
#      https://admin.intellify.pro. Asegurarse de setear `domain` al host real
#      (es lo que usa la resolución por Host).
#   2. Agregar un router Traefik `tenant-<slug>` con Host(`<slug>.intellify.pro`)
#      en el servicio `frontend-tenant` de este archivo (solo labels, sin
#      contenedor nuevo). Si el tenant tiene landing, agregar su router
#      `landing-<slug>` + su directorio en sites/Dockerfile + su línea en el map
#      de sites/nginx.conf.
#   3. docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#        -f docker-compose.tenants.prod.yml up -d --build
#
# Nota TLS: el wildcard *.intellify.pro es solo DNS. El certresolver letsencrypt
# usa HTTP-01/TLS-ALPN-01 (no DNS-01), así que no emite certificados wildcard —
# cada Host() concreto dispara su propia emisión de certificado la primera vez
# que recibe tráfico.

services:
  frontend-tenant:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: ${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"

      # ── ius ─────────────────────────────────────────────────────────────
      - "traefik.http.routers.tenant-ius.rule=Host(`ius.intellify.pro`)"
      - "traefik.http.routers.tenant-ius.entrypoints=websecure"
      - "traefik.http.routers.tenant-ius.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-ius.priority=1"
      - "traefik.http.services.tenant-ius.loadbalancer.server.port=80"

      # ── erma ────────────────────────────────────────────────────────────
      - "traefik.http.routers.tenant-erma.rule=Host(`erma.com.ar`)"
      - "traefik.http.routers.tenant-erma.entrypoints=websecure"
      - "traefik.http.routers.tenant-erma.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-erma.priority=1"
      - "traefik.http.services.tenant-erma.loadbalancer.server.port=80"
      # --- Redirect temporal del dominio viejo (quitar cuando el cliente
      # termine de migrar bookmarks/enlaces externos a erma.com.ar) ---
      - "traefik.http.middlewares.erma-legacy-redirect.redirectregex.regex=^https://erma\\.intellify\\.pro/(.*)"
      - "traefik.http.routers.tenant-erma-legacy.service=tenant-erma"

      # ── pachoteayuda ────────────────────────────────────────────────────
      - "traefik.http.routers.tenant-pachoteayuda.rule=Host(`pachoteayuda.ar`)"
      - "traefik.http.routers.tenant-pachoteayuda.entrypoints=websecure"
      - "traefik.http.routers.tenant-pachoteayuda.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-pachoteayuda.priority=1"
      - "traefik.http.services.tenant-pachoteayuda.loadbalancer.server.port=80"
      # --- www.pachoteayuda.ar: el dominio canónico es el apex (ahí viven la
      # landing y el chat, y así lo declara el <link rel="canonical">), así que
      # www sólo redirige. Además de la redirección, este router es lo que hace
      # que Traefik pida el certificado para www: sin él no hay router que
      # matchee ese host y Traefik responde su certificado por defecto, que el
      # navegador rechaza (el DNS de www ya apunta acá por CNAME). ---
      - "traefik.http.middlewares.pachoteayuda-www-redirect.redirectregex.regex=^https://www\\.pachoteayuda\\.ar/(.*)"
      - "traefik.http.middlewares.pachoteayuda-www-redirect.redirectregex.replacement=https://pachoteayuda.ar/$$1"
      - "traefik.http.middlewares.pachoteayuda-www-redirect.redirectregex.permanent=true"
      - "traefik.http.routers.pachoteayuda-www.rule=Host(`www.pachoteayuda.ar`)"
      - "traefik.http.routers.pachoteayuda-www.entrypoints=websecure"
      - "traefik.http.routers.pachoteayuda-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pachoteayuda-www.middlewares=pachoteayuda-www-redirect"
      - "traefik.http.routers.pachoteayuda-www.service=tenant-pachoteayuda"

      # ── laboralia ───────────────────────────────────────────────────────
      - "traefik.http.routers.tenant-laboralia.rule=Host(`laboralia.intellify.pro`)"
      - "traefik.http.routers.tenant-laboralia.entrypoints=websecure"
      - "traefik.http.routers.tenant-laboralia.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-laboralia.priority=1"
      - "traefik.http.services.tenant-laboralia.loadbalancer.server.port=80"

      # ── proptech ────────────────────────────────────────────────────────
      - "traefik.http.routers.tenant-proptech.rule=Host(`proptech.intellify.pro`)"
      - "traefik.http.routers.tenant-proptech.entrypoints=websecure"
      - "traefik.http.routers.tenant-proptech.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-proptech.priority=1"
      - "traefik.http.services.tenant-proptech.loadbalancer.server.port=80"

      # ── openpadel ───────────────────────────────────────────────────────
      - "traefik.http.routers.tenant-openpadel.rule=Host(`openpadel.pro`)"
      - "traefik.http.routers.tenant-openpadel.entrypoints=websecure"
      - "traefik.http.routers.tenant-openpadel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-openpadel.priority=1"
      - "traefik.http.services.tenant-openpadel.loadbalancer.server.port=80"

  # Un único contenedor sirve todas las landings: el sitio se elige por Host
  # (map $http_host $landing_root en sites/nginx.conf). Cada router de Traefik
  # de abajo matchea "/", las páginas .html y los assets propios de ESA landing
  # con priority=10 (mayor que el priority=1 de frontend-tenant), así que todo
  # lo demás (/login, /dashboard, /assets/*, /api/*...) cae en el SPA del
  # tenant. Ver los comentarios originales en el historial de este archivo.
  landing:
    build:
      context: ./sites
    container_name: gestionar_landing
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"

      # ── pachoteayuda ────────────────────────────────────────────────────
      - 'traefik.http.routers.landing-pachoteayuda.rule=Host(`pachoteayuda.ar`) && (Path(`/`) || PathRegexp(`^/.*\.html$`) || Path(`/chat-widget.js`) || Path(`/robots.txt`) || Path(`/sitemap.xml`) || PathPrefix(`/landing/`) || PathPrefix(`/normas/`) || PathPrefix(`/tramites/`) || PathPrefix(`/residuos/`))'
      - "traefik.http.routers.landing-pachoteayuda.entrypoints=websecure"
      - "traefik.http.routers.landing-pachoteayuda.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-pachoteayuda.priority=10"
      - "traefik.http.services.landing-pachoteayuda.loadbalancer.server.port=80"

      # ── erma ────────────────────────────────────────────────────────────
      - 'traefik.http.routers.landing-erma.rule=Host(`erma.com.ar`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/chat-widget.js`) || Path(`/scroll-fix.js`) || Path(`/assets/bundle.js`) || Path(`/assets/style-DsA80jQ7.css`) || Path(`/hero-video.mp4`) || Path(`/img-about.jpg`) || Path(`/img-gallery-1.jpg`) || Path(`/img-gallery-2.jpg`) || Path(`/img-gallery-3.jpg`) || Path(`/img-gallery-4.jpg`) || Path(`/img-gallery-5.jpg`) || Path(`/img-hero.jpg`) || Path(`/img-news-1.jpg`) || Path(`/img-news-2.jpg`) || Path(`/img-team-1.jpg`) || Path(`/img-team-2.jpg`) || Path(`/img-team-3.jpg`) || Path(`/img-team-barbara.jpg`) || Path(`/img-team-camila.jpg`) || Path(`/img-team-delfina.jpg`) || Path(`/img-team-micaela.jpg`) || Path(`/img-team-valeria.jpg`))'
      - "traefik.http.routers.landing-erma.entrypoints=websecure"
      - "traefik.http.routers.landing-erma.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-erma.priority=10"
      - "traefik.http.services.landing-erma.loadbalancer.server.port=80"

      # ── ius ─────────────────────────────────────────────────────────────
      - 'traefik.http.routers.landing-ius.rule=Host(`ius.intellify.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/register-embed.js`) || Path(`/footer.css`) || Path(`/favicon.svg`) || Path(`/favicon-32.png`) || Path(`/apple-touch-icon.png`) || Path(`/logo-horizontal.svg`) || Path(`/logo-horizontal-blanco.svg`) || Path(`/logo-vertical.svg`) || Path(`/logo-vertical-blanco.svg`) || Path(`/despacho-hero.jpg`) || Path(`/estudio.jpg`) || Path(`/testimonios-bg.jpg`) || Path(`/eduardo-sandoval.webp`) || Path(`/og-image.png`))'
      - "traefik.http.routers.landing-ius.entrypoints=websecure"
      - "traefik.http.routers.landing-ius.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-ius.priority=10"
      - "traefik.http.services.landing-ius.loadbalancer.server.port=80"

      # ── laboralia ───────────────────────────────────────────────────────
      - 'traefik.http.routers.landing-laboralia.rule=Host(`laboralia.intellify.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/favicon.svg`) || Path(`/favicon-32.png`) || Path(`/apple-touch-icon.png`) || Path(`/logo-horizontal.svg`) || Path(`/logo-horizontal-blanco.svg`) || Path(`/logo-vertical-blanco.svg`) || Path(`/despacho-hero.jpg`) || Path(`/estudio.jpg`) || Path(`/testimonios-bg.jpg`) || Path(`/eduardo-sandoval.webp`) || Path(`/og-image.png`))'
      - "traefik.http.routers.landing-laboralia.entrypoints=websecure"
      - "traefik.http.routers.landing-laboralia.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-laboralia.priority=10"
      - "traefik.http.services.landing-laboralia.loadbalancer.server.port=80"

      # ── proptech ────────────────────────────────────────────────────────
      - 'traefik.http.routers.landing-proptech.rule=Host(`proptech.intellify.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/favicon.svg`) || Path(`/favicon-32.png`) || Path(`/apple-touch-icon.png`) || Path(`/logo-horizontal.svg`) || Path(`/logo-horizontal-blanco.svg`) || Path(`/logo-vertical-blanco.svg`) || Path(`/hero-showroom-toyota.jpg`) || Path(`/concesionaria-showroom.jpg`) || Path(`/concesionaria-showroom-2.jpg`) || Path(`/showroom-fila-autos.jpg`) || Path(`/cliente-entrega-llaves.jpg`) || Path(`/autos-fila-lote.jpg`) || Path(`/showroom-suv-dashboard.webp`) || Path(`/testimonios-bg.jpg`) || Path(`/eduardo-sandoval.webp`) || Path(`/og-image.png`))'
      - "traefik.http.routers.landing-proptech.entrypoints=websecure"
      - "traefik.http.routers.landing-proptech.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-proptech.priority=10"
      - "traefik.http.services.landing-proptech.loadbalancer.server.port=80"

      # ── openpadel ───────────────────────────────────────────────────────
      - 'traefik.http.routers.landing-openpadel.rule=Host(`openpadel.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/design-system.css`) || Path(`/chat-widget.js`) || Path(`/padel.mp4`) || PathPrefix(`/uploads/`) || PathPrefix(`/web/`))'
      - "traefik.http.routers.landing-openpadel.entrypoints=websecure"
      - "traefik.http.routers.landing-openpadel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-openpadel.priority=10"
      - "traefik.http.services.landing-openpadel.loadbalancer.server.port=80"

      # ── urbanvoice ──────────────────────────────────────────────────────
      # OJO: el tenant UrbanVoice todavía NO existe, así que este router matchea
      # el host entero (sin regla de Path) y hoy todo el host es de la landing;
      # las rutas que el SPA del tenant va a necesitar (/login, /dashboard,
      # /api/*…) devuelven 404 de nginx hasta que ese tenant se implemente.
      # Cuando se dé de alta, restringir este router a las rutas de la landing
      # y agregar su router tenant-urbanvoice (priority=1) en frontend-tenant.
      - "traefik.http.routers.landing-urbanvoice.rule=Host(`urbanvoice.intellify.pro`)"
      - "traefik.http.routers.landing-urbanvoice.entrypoints=websecure"
      - "traefik.http.routers.landing-urbanvoice.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-urbanvoice.priority=10"
      - "traefik.http.services.landing-urbanvoice.loadbalancer.server.port=80"

networks:
  default:
    name: gestionar_network
    external: true
  traefik_public:
    name: traefik_public
    external: true
