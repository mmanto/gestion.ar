# docker-compose.tenants.prod.yml — Tenants con dominio propio (Fase 7, productivo)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#        -f docker-compose.tenants.prod.yml up -d --build <service>
#
# Un service block por tenant. Todos comparten la misma imagen
# (frontend-tenant/Dockerfile) y se diferencian solo por el env var
# TENANT_ID (inyectado en runtime por frontend-tenant/docker-entrypoint.sh,
# nunca horneado en el build) y por el Host() del label de Traefik.
#
# Alta de un tenant nuevo:
#   1. Crear el tenant/bot/canal en el panel admin (admin.intellify.pro) y
#      capturar el tenant_id.
#   2. Copiar un service block completo, renombrar el service key y el
#      container_name, y setear TENANT_ID + Host().
#      - Subdominio propio (cubierto por el wildcard *.intellify.pro): usar
#        Host(`<slug>.intellify.pro`).
#      - Dominio propio del cliente: el cliente apunta su DNS (A/CNAME) a
#        este mismo servidor, y acá se usa Host(`su-dominio.com`) en vez de
#        un subdominio de intellify.pro. No requiere ningún cambio de código.
#   3. docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#        -f docker-compose.tenants.prod.yml up -d --build <nuevo-service>
#
# Nota TLS: el wildcard *.intellify.pro es solo DNS. El certresolver
# letsencrypt usa HTTP-01 (no DNS-01), así que no emite certificados
# wildcard — cada Host() concreto de acá dispara su propia emisión de
# certificado la primera vez que recibe tráfico HTTPS.

services:
  frontend-tenant-ius:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: ${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    environment:
      - TENANT_ID=${TENANT_ID_IUS}
      - TENANT_SLUG=ius
      - STATS_TWO_COLS_MOBILE=true
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-ius.rule=Host(`ius.intellify.pro`)"
      - "traefik.http.routers.tenant-ius.entrypoints=websecure"
      - "traefik.http.routers.tenant-ius.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-ius.priority=1"
      - "traefik.http.services.tenant-ius.loadbalancer.server.port=80"

  frontend-tenant-erma:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: ${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant_erma
    environment:
      - TENANT_ID=${TENANT_ID_ERMA}
      - TENANT_SLUG=erma
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-erma.rule=Host(`erma.com.ar`)"
      - "traefik.http.routers.tenant-erma.entrypoints=websecure"
      - "traefik.http.routers.tenant-erma.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-erma.priority=1"
      - "traefik.http.services.tenant-erma.loadbalancer.server.port=80"
      # --- Redirect temporal del dominio viejo (quitar cuando el cliente
      # termine de migrar bookmarks/enlaces externos a erma.com.ar) ---
      - "traefik.http.middlewares.erma-legacy-redirect.redirectregex.regex=^https://erma\\.intellify\\.pro/(.*)"
      - "traefik.http.routers.tenant-erma-legacy.service=tenant-erma"

  frontend-tenant-pachoteayuda:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: ${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant_pachoteayuda
    environment:
      - TENANT_ID=${TENANT_ID_PACHOTESAYUDA}
      - TENANT_SLUG=pachoteayuda
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-pachoteayuda.rule=Host(`pachoteayuda.ar`)"
      - "traefik.http.routers.tenant-pachoteayuda.entrypoints=websecure"
      - "traefik.http.routers.tenant-pachoteayuda.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-pachoteayuda.priority=1"
      - "traefik.http.services.tenant-pachoteayuda.loadbalancer.server.port=80"

  # ipachoteayuda: dominio propio de subdominio pachoteayuda.intellify.pro
  # (cubierto por el wildcard *.intellify.pro del DNS — cada Host() concreto
  # dispara su propia emisión de certificado, ver DEPLOYMENT.md).
  frontend-tenant-ipachoteayuda:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: ${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant_ipachoteayuda
    environment:
      - TENANT_ID=${TENANT_ID_IPACHOTESAYUDA}
      - TENANT_SLUG=ipachoteayuda
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-ipachoteayuda.rule=Host(`pachoteayuda.intellify.pro`)"
      - "traefik.http.routers.tenant-ipachoteayuda.entrypoints=websecure"
      - "traefik.http.routers.tenant-ipachoteayuda.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-ipachoteayuda.priority=1"
      - "traefik.http.services.tenant-ipachoteayuda.loadbalancer.server.port=80"

  # landing-ipachoteayuda comparte dominio con frontend-tenant-ipachoteayuda
  # (pachoteayuda.intellify.pro): este router matchea "/", cualquier página
  # .html de la landing (PathRegexp) y el chat-widget — cualquier otra ruta
  # (/login, /dashboard, /assets/*, /api/*...) cae en tenant-ipachoteayuda.
  # Mismo criterio que landing-ius/laboralia/proptech.
  landing-ipachoteayuda:
    build:
      context: ./sites/ipachoteayuda-landing
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-ipachoteayuda.rule=Host(`pachoteayuda.intellify.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/chat-widget.js`))'
      - "traefik.http.routers.landing-ipachoteayuda.entrypoints=websecure"
      - "traefik.http.routers.landing-ipachoteayuda.tls.certresolver=letsencrypt"
  # landing-pachoteayuda comparte dominio con frontend-tenant-pachoteayuda
  # (pachoteayuda.ar): mismo tenant de negocio que ipachoteayuda, misma
  # landing y mismo canal de chat (el widget resuelve el origen en runtime
  # con location.origin y la info pública del canal no está acotada por
  # tenant), desplegado en el dominio propio del cliente. Cualquier otra
  # ruta (/login, /dashboard, /assets/*, /api/*...) cae en tenant-pachoteayuda.
  landing-pachoteayuda:
    build:
      context: ./sites/pachoteayuda-landing
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-pachoteayuda.rule=Host(`pachoteayuda.ar`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/chat-widget.js`))'
      - "traefik.http.routers.landing-pachoteayuda.entrypoints=websecure"
      - "traefik.http.routers.landing-pachoteayuda.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-pachoteayuda.priority=10"
      - "traefik.http.services.landing-pachoteayuda.loadbalancer.server.port=80"

  # landing-erma comparte dominio con frontend-tenant-erma (erma.com.ar):

  # landing-erma comparte dominio con frontend-tenant-erma (erma.com.ar):

  # landing-erma comparte dominio con frontend-tenant-erma (erma.com.ar):
  # este router matchea "/", cualquier página .html de la landing (PathRegexp),
  # el bundle/estilos propios y el hero-video — cualquier otra ruta (/login,
  # /dashboard, /assets/*, /api/*...) sigue cayendo en tenant-erma. Mismo
  # criterio que landing-ius/laboralia/proptech.
  landing-erma:
    build:
      context: ./sites/erma
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-erma.rule=Host(`erma.com.ar`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/chat-widget.js`) || Path(`/scroll-fix.js`) || Path(`/assets/bundle.js`) || Path(`/assets/style-DsA80jQ7.css`) || Path(`/hero-video.mp4`) || Path(`/img-about.jpg`) || Path(`/img-gallery-1.jpg`) || Path(`/img-gallery-2.jpg`) || Path(`/img-gallery-3.jpg`) || Path(`/img-gallery-4.jpg`) || Path(`/img-gallery-5.jpg`) || Path(`/img-hero.jpg`) || Path(`/img-news-1.jpg`) || Path(`/img-news-2.jpg`) || Path(`/img-team-1.jpg`) || Path(`/img-team-2.jpg`) || Path(`/img-team-3.jpg`) || Path(`/img-team-barbara.jpg`) || Path(`/img-team-camila.jpg`) || Path(`/img-team-delfina.jpg`) || Path(`/img-team-micaela.jpg`) || Path(`/img-team-valeria.jpg`))'
      - "traefik.http.routers.landing-erma.entrypoints=websecure"
      - "traefik.http.routers.landing-erma.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-erma.priority=10"
      - "traefik.http.services.landing-erma.loadbalancer.server.port=80"

  frontend-tenant-laboralia:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: ${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant_laboralia
    environment:
      - TENANT_ID=${TENANT_ID_LABORALIA}
      - TENANT_SLUG=laboralia
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-laboralia.rule=Host(`laboralia.intellify.pro`)"
      - "traefik.http.routers.tenant-laboralia.entrypoints=websecure"
      - "traefik.http.routers.tenant-laboralia.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-laboralia.priority=1"
      - "traefik.http.services.tenant-laboralia.loadbalancer.server.port=80"

  frontend-tenant-proptech:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: ${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant_proptech
    environment:
      - TENANT_ID=${TENANT_ID_PROPTECH}
      - TENANT_SLUG=proptech
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-proptech.rule=Host(`proptech.intellify.pro`)"
      - "traefik.http.routers.tenant-proptech.entrypoints=websecure"
      - "traefik.http.routers.tenant-proptech.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-proptech.priority=1"
      - "traefik.http.services.tenant-proptech.loadbalancer.server.port=80"

  # landing-ius comparte dominio con frontend-tenant-ius (ius.intellify.pro):
  # este router matchea "/", cualquier página .html de la landing (PathRegexp:
  # si mañana se agrega contacto.html u otra página ya queda cubierta sin tocar
  # esta regla) y los assets propios de la landing (lista fija, sin colisión
  # con los nombres que ya sirve frontend-tenant-ius bajo /icons, /img,
  # favicon.ico, etc.) — cualquier otra ruta (/login, /dashboard, /assets/*,
  # /api/*...) sigue cayendo en tenant-ius. Priority explícita para no depender
  # del cálculo automático de Traefik por longitud de regla.
  landing-ius:
    build:
      context: ./sites/ius-landing
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-ius.rule=Host(`ius.intellify.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/register-embed.js`) || Path(`/favicon.svg`) || Path(`/favicon-32.png`) || Path(`/apple-touch-icon.png`) || Path(`/logo-horizontal.svg`) || Path(`/logo-horizontal-blanco.svg`) || Path(`/logo-vertical.svg`) || Path(`/logo-vertical-blanco.svg`) || Path(`/despacho-hero.jpg`) || Path(`/estudio.jpg`) || Path(`/testimonios-bg.jpg`) || Path(`/eduardo-sandoval.webp`) || Path(`/og-image.png`))'
      - "traefik.http.routers.landing-ius.entrypoints=websecure"
      - "traefik.http.routers.landing-ius.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-ius.priority=10"
      - "traefik.http.services.landing-ius.loadbalancer.server.port=80"

  # landing-laboralia comparte dominio con frontend-tenant-laboralia
  # (laboralia.intellify.pro): el router matchea "/", cualquier página .html
  # de la landing (PathRegexp) y sus assets propios — cualquier otra ruta
  # (/login, /dashboard, /assets/*, /api/*...) sigue cayendo en
  # tenant-laboralia.
  landing-laboralia:
    build:
      context: ./sites/laboralia-landing
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-laboralia.rule=Host(`laboralia.intellify.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/favicon.svg`) || Path(`/favicon-32.png`) || Path(`/apple-touch-icon.png`) || Path(`/logo-horizontal.svg`) || Path(`/logo-horizontal-blanco.svg`) || Path(`/logo-vertical-blanco.svg`) || Path(`/despacho-hero.jpg`) || Path(`/estudio.jpg`) || Path(`/testimonios-bg.jpg`) || Path(`/eduardo-sandoval.webp`) || Path(`/og-image.png`))'
      - "traefik.http.routers.landing-laboralia.entrypoints=websecure"
      - "traefik.http.routers.landing-laboralia.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-laboralia.priority=10"
      - "traefik.http.services.landing-laboralia.loadbalancer.server.port=80"

  # landing-proptech comparte dominio con frontend-tenant-proptech
  # (proptech.intellify.pro): mismo criterio que landing-laboralia.
  landing-proptech:
    build:
      context: ./sites/proptech-landing
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-proptech.rule=Host(`proptech.intellify.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/favicon.svg`) || Path(`/favicon-32.png`) || Path(`/apple-touch-icon.png`) || Path(`/logo-horizontal.svg`) || Path(`/logo-horizontal-blanco.svg`) || Path(`/logo-vertical-blanco.svg`) || Path(`/hero-showroom-toyota.jpg`) || Path(`/concesionaria-showroom.jpg`) || Path(`/concesionaria-showroom-2.jpg`) || Path(`/showroom-fila-autos.jpg`) || Path(`/cliente-entrega-llaves.jpg`) || Path(`/autos-fila-lote.jpg`) || Path(`/showroom-suv-dashboard.webp`) || Path(`/testimonios-bg.jpg`) || Path(`/eduardo-sandoval.webp`) || Path(`/og-image.png`))'
      - "traefik.http.routers.landing-proptech.entrypoints=websecure"
      - "traefik.http.routers.landing-proptech.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-proptech.priority=10"
      - "traefik.http.services.landing-proptech.loadbalancer.server.port=80"


  # ── OpenPadel ────────────────────────────────────────────────────────────────
  # Dominio propio: openpadel.pro (el cliente apunta su DNS A/CNAME a este
  # servidor). Traefik emite el certificado TLS-ALPN-01 la primera vez que
  # recibe tráfico HTTPS en ese Host().
  #
  # La landing (landing-openpadel) matchea "/" y las páginas .html;
  # cualquier otra ruta (/login, /dashboard, /assets/*, /api/*…) cae en
  # frontend-tenant-openpadel (priority=1 < priority=10 de la landing).
  frontend-tenant-openpadel:
    build:
      context: ./frontend-tenant
      dockerfile: Dockerfile
      args:
        VITE_TARGET: staff
        VITE_APPOINTMENTS_REMOTE_URL: ${VITE_APPOINTMENTS_REMOTE_URL:-https://appointments-widgets.intellify.pro/remoteEntry.js}
        VITE_NANGO_CONNECT_URL: https://nango.intellify.pro
        VITE_NANGO_API_URL: https://api.nango.intellify.pro
    container_name: gestionar_frontend_tenant_openpadel
    environment:
      - TENANT_ID=${TENANT_ID_OPENPADEL}
      - TENANT_SLUG=openpadel
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.tenant-openpadel.rule=Host(`openpadel.pro`)"
      - "traefik.http.routers.tenant-openpadel.entrypoints=websecure"
      - "traefik.http.routers.tenant-openpadel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tenant-openpadel.priority=1"
      - "traefik.http.services.tenant-openpadel.loadbalancer.server.port=80"

  # landing-openpadel comparte dominio con frontend-tenant-openpadel
  # (openpadel.pro): este router matchea "/", cualquier página .html de la
  # landing (PathRegexp), el CSS del design system, el video hero y todos los
  # assets bajo /uploads/ y /web/ — cualquier otra ruta (/login, /dashboard,
  # /assets/*, /api/*...) cae en frontend-tenant-openpadel.
  # Mismo criterio que landing-erma y demás landings del stack.
  landing-openpadel:
    build:
      context: ./sites/openpadel-landing
    container_name: gestionar_landing_openpadel
    restart: unless-stopped
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - 'traefik.http.routers.landing-openpadel.rule=Host(`openpadel.pro`) && (PathRegexp(`^/.*\.html$`) || Path(`/`) || Path(`/design-system.css`) || Path(`/chat-widget.js`) || Path(`/padel.mp4`) || PathPrefix(`/uploads/`) || PathPrefix(`/web/`))'
      - "traefik.http.routers.landing-openpadel.entrypoints=websecure"
      - "traefik.http.routers.landing-openpadel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.landing-openpadel.priority=10"
      - "traefik.http.services.landing-openpadel.loadbalancer.server.port=80"

networks:
  default:
    name: gestionar_network
    external: true
  traefik_public:
    name: traefik_public
    external: true
