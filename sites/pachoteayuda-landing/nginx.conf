server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # HTML: nunca cachear (ver comentario en sites/ius-landing/nginx.conf).
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Chat embed (chat-widget.js) — nombre fijo entre redeploys: impedir el
    # caché heurístico del navegador para no servir una versión vieja.
    location = /chat-widget.js {
        expires -1;
    }

    # SEO: robots.txt y sitemap.xml son del sitio, no del SPA del tenant (que
    # responde 200 con su index.html en cualquier ruta). El router de Traefik
    # manda estos dos paths acá; sin caché para que un cambio se vea enseguida.
    location = /robots.txt {
        expires -1;
    }
    location = /sitemap.xml {
        expires -1;
    }

    # Assets propios de la landing (logo, héroe, og-image, favicon). Van bajo
    # /landing/ para no chocar con /assets/* ni /img/ del SPA del tenant.
    location ^~ /landing/ {
        expires 7d;
    }

    # Páginas generadas por scripts/generate_pachoteayuda_pages.py (una por
    # norma del HCD + la guía de trámites). HTML: sin caché, igual que index.html.
    location ^~ /normas/ {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location ^~ /tramites/ {
        expires -1;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
