server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Cache de archivos estáticos
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML: nunca cachear. Sin esta cabecera nginx aplica caché heurística y el
    # navegador guarda una copia por URL (query incluido) — p.ej.
    # /registro.html?plan=anual es una entrada de caché distinta de ?plan=mensual,
    # así que tras un deploy una página ya visitada podía seguir mostrando la
    # versión vieja mientras otra (no visitada) traía la nueva.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
