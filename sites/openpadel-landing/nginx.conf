server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # HTML: nunca cachear para que los cambios de landing lleguen inmediatamente.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Chat embed — nombre fijo entre redeploys: impedir caché heurístico
    # del navegador para no servir una versión vieja.
    location = /chat-widget.js {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
