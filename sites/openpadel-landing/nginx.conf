server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip — excluir video (mp4/webm ya están comprimidos)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/json
        application/javascript
        image/svg+xml;

    # HTML: sin caché para que los cambios lleguen de inmediato
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # CSS con nombre fijo (design-system.css): sin caché heurístico
    location = /design-system.css {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Chat embed (chat-widget.js) — mismo criterio: nombre fijo entre redeploys.
    location = /chat-widget.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Video — sin compresión, acepta Range requests para el <video> del browser
    location ~* \.(mp4|webm|ogg)$ {
        gzip off;
        add_header Accept-Ranges bytes;
        expires 7d;
        try_files $uri =404;
    }

    # Imágenes y fuentes — caché largo
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploads y subdirectorios estáticos de la web
    location /uploads/ {
        try_files $uri =404;
    }

    location /web/ {
        try_files $uri $uri/ =404;
    }

    # Raíz y resto
    location / {
        try_files $uri $uri/ =404;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
