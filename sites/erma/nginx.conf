server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Cache de imágenes y video (nombres fijos entre redeploys, contenido mutable
    # pero pesado — 1y con immutable como las otras landings)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML: nunca cachear (misma razón que en ius-landing — caché heurística
    # del navegador por URL)
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Bundle de la landing (bundle.js) — nombre fijo entre redeploys, hay que
    # impedir el caché heurístico del navegador para no servir una versión vieja
    # a quien ya la visitó.
    location = /assets/bundle.js {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}