# nginx unificado para TODAS las landings: la raíz se elige por Host
# (map $http_host $landing_root). Unifica las reglas equivalentes de los
# nginx.conf por sitio: HTML sin caché, archivos de nombre fijo sin caché
# heurístico, imágenes inmutables, video con Range, y páginas generadas de
# pachoteayuda bajo /normas/, /tramites/ y /residuos/.
map $http_host $landing_root {
    ius.intellify.pro /usr/share/nginx/html/ius;
    laboralia.intellify.pro /usr/share/nginx/html/laboralia;
    proptech.intellify.pro /usr/share/nginx/html/proptech;
    erma.com.ar /usr/share/nginx/html/erma;
    pachoteayuda.ar /usr/share/nginx/html/pachoteayuda;
    openpadel.pro /usr/share/nginx/html/openpadel;
    urbanvoice.intellify.pro /usr/share/nginx/html/urbanvoice;
    # Dev local (docker-compose.tenants.local.yml, dominios *.test)
    erma.com.test /usr/share/nginx/html/erma;
    ius.mx.test /usr/share/nginx/html/ius;
    default /usr/share/nginx/html/__unknown__;
}

server {
    listen 80;
    server_name _;
    root $landing_root;
    index index.html;

    # Compresión Gzip (el video se excluye en su location).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;

    # HTML: nunca cachear — evita el caché heurístico del navegador por URL.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Archivos de nombre fijo entre redeploys: sin caché heurístico.
    location = /chat-widget.js { expires -1; }
    location = /design-system.css { expires -1; }
    location = /register-embed.js { expires -1; }
    location = /scroll-fix.js { expires -1; }
    location = /assets/bundle.js { expires -1; }

    # SEO: robots.txt y sitemap.xml son del sitio, no del SPA del tenant.
    location = /robots.txt { expires -1; }
    location = /sitemap.xml { expires -1; }

    # Video: sin gzip (ya está comprimido) y con Range para el <video> del browser.
    location ~* \.(mp4|webm|ogg)$ {
        gzip off;
        add_header Accept-Ranges bytes;
        expires 7d;
        try_files $uri =404;
    }

    # Imágenes y fuentes: caché largo inmutable.
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets propios de la landing de pachoteayuda (bajo /landing/, incl. seo.css).
    location ^~ /landing/ {
        expires 7d;
        try_files $uri =404;
    }

    # Páginas generadas por scripts/generate_pachoteayuda_pages.py (HTML sin
    # caché + index de directorio).
    location ^~ /normas/ {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location ^~ /tramites/ {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location ^~ /residuos/ {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Subdirectorios estáticos de la landing de openpadel.
    location /uploads/ {
        try_files $uri =404;
    }
    location /web/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
