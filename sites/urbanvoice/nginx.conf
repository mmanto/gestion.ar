server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip — no toca las imágenes (PNG ya comprimidos sin pérdida).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/json
        application/javascript
        image/svg+xml;

    # HTML: sin caché. La landing es un único index.html sin assets hasheados,
    # así que un HTML guardado por el caché heurístico del navegador dejaría al
    # visitante viendo la versión anterior después de un deploy.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Imágenes de la landing (images/*.png): 7d, sin "immutable". Los nombres no
    # llevan hash, así que un immutable de 30d/1año dejaría a los visitantes con
    # el asset viejo pegados después de reemplazar un archivo.
    location ^~ /images/ {
        expires 7d;
        try_files $uri =404;
    }

    # Raíz y resto (hoy sólo index.html).
    location / {
        try_files $uri $uri/ =404;
    }

    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
